name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Docker is preinstalled on GitHub-hosted ubuntu-latest runners, so the
      # Testcontainers-based integration tests (which spin up their own
      # throwaway Postgres container) run here with no extra services: block.
      - name: Run backend test suite
        run: mvn -B test

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Build backend jar
        run: mvn -B -DskipTests clean package

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/canteen-saarthi-backend.jar
          retention-days: 7

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: npm` yet — that requires a committed package-lock.json.
          # Once you've run `npm install` locally once and committed the
          # resulting lockfile, switch this to `npm ci` above and add:
          #   cache: npm
          #   cache-dependency-path: frontend/package-lock.json
          # for faster, fully reproducible CI installs.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc -b

      - name: Run frontend test suite
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # These builds are validation-only (no push to a registry) — they catch
      # Dockerfile / build-context errors in CI before anyone deploys to EC2.
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: canteen-saarthi-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: canteen-saarthi-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
