# LOCAL DEVELOPMENT stack.
# Brings up: Postgres + backend (Spring Boot) + frontend (Nginx serving the built SPA).
# Usage:
#   docker compose up --build
# Then open http://localhost:8081  (frontend, proxies /api to backend)
#   Backend directly:  http://localhost:8080/api/healthz
#   Swagger UI:        http://localhost:8080/swagger-ui.html
name: canteen-saarthi-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: canteen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: canteen_saarthi
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_pass
    ports:
      - "5432:5432"
    volumes:
      - canteen_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d canteen_saarthi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canteen-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: canteen_saarthi
      DB_USERNAME: canteen_user
      DB_PASSWORD: canteen_pass
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8081"
      APP_JWT_SECRET: "local-compose-dev-secret-change-me-32-bytes-min"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "ChangeMe123!"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canteen-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  canteen_pg_data:
