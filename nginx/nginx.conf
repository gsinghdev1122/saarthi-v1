# Host-level Nginx running in its own container, in front of the frontend and backend
# containers. Terminates TLS (once you have a cert) and reverse-proxies everything else.
#
# HTTP-only version (works immediately). See docs/AWS-EC2-DEPLOYMENT.md for the
# Certbot / Let's Encrypt steps to add the HTTPS server block using the certs
# mounted at /etc/nginx/certs.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Basic rate limiting for the public API surface.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Health check target for the AWS load balancer / manual monitoring.
        location /healthz {
            proxy_pass http://backend_upstream/api/healthz;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui.html {
            proxy_pass http://backend_upstream/swagger-ui.html;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://backend_upstream/v3/api-docs;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --------------------------------------------------------------------
    # HTTPS server block - uncomment and fill in once you have a certificate
    # (see docs/AWS-EC2-DEPLOYMENT.md, Step 8). Also change the "listen 80"
    # block above to redirect to https once this is enabled.
    # --------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     location /api/ {
    #         proxy_pass http://backend_upstream/api/;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host $host;
    #     }
    # }
}
