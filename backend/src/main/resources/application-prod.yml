# Profile used on the EC2 host / production deployment.
# DATABASE_URL style values are read from environment variables injected by
# docker-compose.prod.yml (which in turn reads them from the server's .env file).
# Works equally well against a Supabase Postgres instance - just point
# DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD (and DB_SSL_MODE=require) at Supabase.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

# APP_JWT_SECRET and ADMIN_PASSWORD MUST be overridden via the .env file in
# production (see .env.prod.example) — the defaults in application.yml are
# for local development only and are not safe to run publicly.
app.jwt:
  secret: ${APP_JWT_SECRET}

app.admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}

logging:
  level:
    root: WARN
    com.csd.canteen: INFO
