# Profile used inside the backend Docker container (see docker-compose.yml).
# All values are supplied as environment variables at container run time.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:canteen_saarthi}
    username: ${DB_USERNAME:canteen_user}
    password: ${DB_PASSWORD:canteen_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.csd.canteen: INFO
