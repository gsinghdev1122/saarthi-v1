spring:
  application:
    name: canteen-saarthi-backend 
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates it matches.
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

app.jwt:
  secret: ${APP_JWT_SECRET:local-dev-only-secret-change-me-32-bytes-minimum}
  expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}

app.admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:ChangeMe123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
